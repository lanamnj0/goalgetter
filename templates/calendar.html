{% extends "layout.html" %}

{% block title %}
    Dashboard
{% endblock %}
  {% block extra_styles %}
    <!-- Required meta tags -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:200,300,400,700,800&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,800&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="../static/calendar_assets/fonts/icomoon/style.css">
  
    <link href='../static/calendar_assets/fullcalendar/packages/core/main.css' rel='stylesheet' />
    <link href='../static/calendar_assets/fullcalendar/packages/daygrid/main.css' rel='stylesheet' />
    
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/calendar_assets/css/bootstrap.min.css">
    <!-- Style -->
    <link rel="stylesheet" href="../static/calendar_assets/css/style.css">
  {% endblock %}

  {% block main %}

        <!-- Widget 1-->
        <div class="card mb-3 shadow-sm border-0">
            <div class="card-body p-3">
                <small class="text-muted text-uppercase fw-bold">Sessions Complete:</small>
                <!-- Temporarily hardcoded for now, can be easily replaced afterwards-->
                <h3 class="mb-0 fw-bold">11</h3>
            </div>
        </div>

        <!-- Widget 2-->
        <div class="card mb-3 shadow-sm border-0">
            <div class="card-body p-3">
                <small class="text-muted text-uppercase fw-bold">Current Streak:</small>
                <h3 class="mb-9 fw-bold">5</h3>
            </div>
        </div>

        <!-- Widget 3-->
        <div class="card mb-3 shadow-sm border-0">
            <div class="card-body p-3">
                <small class="text-muted text-uppercase fw-bold">Total time:</small>
                <h3 class="mb-0 fw-bold">300 minutes</h3>
            </div>
        </div>

        <!-- Calendar implementation-->
        <div class="content" class="col-md-8 mb-4"> <!--8/12 calendar, 4/12 widgets -->
            <div id='calendar'></div>
        </div>


    <script src="../static/calendar_assets/js/jquery-3.3.1.min.js"></script>
    <script src="../static/calendar_assets/js/popper.min.js"></script>
    <script src="../static/calendar_assets/js/bootstrap.min.js"></script>

    <script src='../static/calendar_assets/fullcalendar/packages/core/main.js'></script>
    <script src='../static/calendar_assets/fullcalendar/packages/interaction/main.js'></script>
    <script src='../static/calendar_assets/fullcalendar/packages/daygrid/main.js'></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
      plugins: [ 'interaction', 'dayGrid' ],
      defaultDate: '2026-06-12',
      editable: true,
      eventLimit: true, // allow "more" link when too many events
      /* change events to  events:'/route_name' when data for events available */
      events: [
        {
          title: 'Leg day',
          start: '2026-06-01'
        },
        {
          title: 'Rest days',
          start: '2026-06-10',
          end: '2026-06-12'
        },
        {
          title: 'Upper body',
          start: '2026-06-13'
        },
        {
          title: 'Arm day',
          start: '2026-06-28'
        },
        {
          title: 'Lower body',
          start: '2026-06-21'
        }
      ]
    });

    calendar.render();
  });

    </script>

    <script src="../static/calendar_assets/js/main.js"></script>
  {% endblock %}
