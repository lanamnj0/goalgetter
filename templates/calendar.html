{% extends "layout.html" %}

{% block title %}
    Dashboard
{% endblock %}
  {% block extra_styles %}
    <!-- Required meta tags -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:200,300,400,700,800&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,800&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="../static/calendar_assets/fonts/icomoon/style.css">
  
    <link href='../static/calendar_assets/fullcalendar/packages/core/main.css' rel='stylesheet' />
    <link href='../static/calendar_assets/fullcalendar/packages/daygrid/main.css' rel='stylesheet' />
    
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/calendar_assets/css/bootstrap.min.css">
    <!-- Style -->
    <link rel="stylesheet" href="../static/calendar_assets/css/style.css">
  {% endblock %}

  {% block main %}

  <div class="content">
    <div id='calendar'></div>
  </div>
    
    

    <script src="../static/calendar_assets/js/jquery-3.3.1.min.js"></script>
    <script src="../static/calendar_assets/js/popper.min.js"></script>
    <script src="../static/calendar_assets/js/bootstrap.min.js"></script>

    <script src='../static/calendar_assets/fullcalendar/packages/core/main.js'></script>
    <script src='../static/calendar_assets/fullcalendar/packages/interaction/main.js'></script>
    <script src='../static/calendar_assets/fullcalendar/packages/daygrid/main.js'></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
      plugins: [ 'interaction', 'dayGrid' ],
      defaultDate: '2020-02-12',
      editable: true,
      eventLimit: true, // allow "more" link when too many events
      /* change events to  events:'/rout_name' when data for events available */
      events: [
        {
          title: 'Leg day',
          start: '2020-02-01'
        },
        {
          title: 'Rest days',
          start: '2020-02-07',
          end: '2020-02-10'
        },
        {
          groupId: 999,
          title: 'Repeating Event',
          start: '2020-02-09T16:00:00'
        },
        {
          groupId: 999,
          title: 'Repeating Event',
          start: '2020-02-16T16:00:00'
        },
        {
          title: 'Upper body',
          start: '2020-02-13T07:00:00'
        },
        {
          title: 'Arm day',
          start: '2020-02-28'
        }
      ]
    });

    calendar.render();
  });

    </script>

    <script src="../static/calendar_assets/js/main.js"></script>
  {% endblock %}
