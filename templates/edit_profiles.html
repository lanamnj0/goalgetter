{% extends "layout.html" %}

{% block title %}
    Edit Profile
{% endblock %}

{% block main %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-header p-3">
        <h1 class="h5 mb-0 fw-bold">Edit Profile</h1>
    </div>

    <div class="card-body p-4">
        <p class="text-muted">
            Profile editing is displayed as part of the GoalGetter demo.
            Database-backed profile updates are not enabled yet.
        </p>

        <form>
            <div class="mb-3">
                <label for="profile-name" class="form-label">
                    Display name
                </label>

                <input
                    id="profile-name"
                    class="form-control"
                    type="text"
                    value="Clare Smith"
                    disabled
                >
            </div>

            <div class="mb-3">
                <label for="profile-weight" class="form-label">
                    Current weight (kg)
                </label>

                <input
                    id="profile-weight"
                    class="form-control"
                    type="number"
                    value="65"
                    disabled
                >
            </div>

            <a
                class="btn btn-outline-secondary"
                href="{{ url_for('profile') }}"
            >
                Back to profile
            </a>
        </form>
    </div>
</div>
{% endblock %}
