<!-- Legacy demonstration recipe gallery. -->

{% extends "layout.html" %}

{% block title %}
    Meals & Recipes
{% endblock %}

{% block main %}
    <div class="container-fluid py-4" style="max-width: 100%;">
        <div class="row g-3">
            <!-- Loop through the meals passed from Flask -->
            {% for meal in meals %}
                <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6">
                    <div class="card h-100 shadow-sm">
                        <!-- If image_url exists, show it; otherwise show an emoji placeholder -->
                        {% if meal.image_url %}
                            <img src="{{ meal.image_url }}"
                                 class="card-img-top"
                                 alt="{{ meal.name }}"
                                 style="height: 200px; object-fit: cover; width: 100%;">
                        {% else %}
                            <div style="height: 200px; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); display: flex; align-items: center; justify-content: center; font-size: 4rem;">
                                🍽️
                            </div>
                        {% endif %}
                        <div class="card-body">
                            <h5 class="card-title">{{ meal.name }}</h5>
                            <p class="card-text small text-muted">{{ meal.description }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge bg-success">{{ meal.prep_time }} mins</span>
                                <span class="badge bg-primary">{{ meal.calories }} kcal</span>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
