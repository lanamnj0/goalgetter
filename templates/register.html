{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 500px;">
    <div class="card-body p-5 text-center">
        <span class="material-symbols-outlined display-4 text-primary">
            person_add
        </span>

        <h1 class="h3 mt-3">Create an account</h1>

        <p class="text-muted">
            Account registration is not enabled in this demonstration
            version of GoalGetter.
        </p>

        <a
            class="btn btn-primary"
            href="{{ url_for('frontend.dashboard') }}"
        >
            Explore the demo
        </a>

        <a
            class="btn btn-outline-secondary"
            href="{{ url_for('login') }}"
        >
            Back to login
        </a>
    </div>
</div>
{% endblock %}
