{% extends "layout.html" %}

{% block title %}
    Workouts
{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="../static/style.css"/>
{% endblock %}

{% block main %}

  <div class="container py-4">
    <div class="row justify-content-center">

      <div class="col-md-4">
      <div class="container-fluid px-0 py-4 overflow-hidden">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
          <div class="card-body p-4"> <div id="partialVisibleCarousel" class="carousel slide partial-slider" data-bs-ride="carousel">
              </div>
            <!-- Carousel Inner (Bootstrap)-->
            <div class="carousel-inner">

              <!-- Slide 1 -->
              <div class="carousel-item active">
                <div class="slider-card-content rounded-3 shadow">
                  <img src="../static/image-one-carousel.png" alt="">
                  <div class="slider-overlay">
                  </div>
                </div>
              </div>

              <!-- Slide 2 -->
              <div class="carousel-item">
                <div class="slider-card-content rounded-3 shadow">
                  <img src="../static/image-two-carousel.png" alt="">
                  <div class="slider-overlay">
                  </div>
                </div>
              </div>

              <!-- Slide 3 -->
              <div class="carousel-item">
                <div class="slider-card-content rounded-3 shadow">
                  <img src="../static/image-three-carousel.png" alt="">
                  <div class="slider-overlay">
                  </div>
                </div>
              </div>

            </div>

            <!-- Navigation Controls (Fixed Z-Index and Layout) -->
            <button class="carousel-control-prev custom-control" type="button" data-bs-target="#partialVisibleCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon bg-dark p-3 rounded-circle" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next custom-control" type="button" data-bs-target="#partialVisibleCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon bg-dark p-3 rounded-circle" aria-hidden="true"></span>
            </button>


          </div>
        </div>
      </div>

    </div>
  </div>
  </div>
