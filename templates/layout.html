<!--
Used tutorials from Creative Babar to get help in dashboard and sidebar layout -->

<!-- type 'open layout.html' in terminal to see in browser! -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>GoalGetter: {% block title %} {% endblock %}</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../static/style.css"> <!--'../' means to go out of current file -->
</head>
<body>

    <div class="container">
        <aside>
            <div class="top">

                <div class="logo">
                    <h2 class="fw-bold"><span class="material-symbols-outlined sidebar-icon">monitoring</span>Goal<span class="danger">Getter</span></h2>
                </div>
                <div class="close">
                    <span class="material-symbols-outlined">close</span>
                </div>
            </div>
            <!-- End of top section -->

            <div class="sidebar" class="list-group">
                <a href="/" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/' %} active {% endif %}">
                    <span class="material-symbols-outlined">grid_view</span>
                    <h3>Dashboard</h3>
                </a>
                <a href="/workouts" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/workouts' %} active {% endif %}">
                    <span class="material-symbols-outlined">fitness_center</span>
                    <h3>Workouts</h3>
                </a>
                <a href="/meals_and_recipes" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/meals_and_recipes' %} active {% endif %}">
                    <span class="material-symbols-outlined">chef_hat</span>
                    <h3>Nutritional Meals & Recipes</h3>
                </a>
                <a href="/history" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/history' %} active {% endif %}">
                    <span class="material-symbols-outlined">history</span>
                    <h3>History</h3>
                </a>
                 <a href="/support" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/support' %} active {% endif %}">
                    <span class="material-symbols-outlined">contact_support</span>
                    <h3>Support</h3>
                </a>
                <a href="/settings" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/settings' %} active {% endif %}">
                    <span class="material-symbols-outlined">settings</span>
                    <h3>Settings</h3>
                </a>
                <a href="/logout" class="nav-link text-decoration-none" class="list-group-item list-group-item-action {% if request.path == '/logout' %} active {% endif %}">
                    <span class="material-symbols-outlined">logout</span>
                    <h3>Logout</h3>
                </a>

            </div>

        </aside>

        <main>
            {% block main %} {% endblock %}
        </main>

            <!--<div class="right">
                <h1> Right </h1>
            </div>-->
    </div>
    <script src="../static/script.js"></script>
</body>
</html>
